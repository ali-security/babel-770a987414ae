name: Lock Threads

on:
  workflow_dispatch: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dessant/lock-threads@v2
        with:
          github-token: ${{ github.token }}
          issue-lock-inactive-days: '91'
          issue-lock-labels: 'outdated'
          pr-lock-inactive-days: '91'
          pr-lock-labels: 'outdated'
